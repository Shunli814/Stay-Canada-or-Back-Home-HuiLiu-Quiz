<p class="note">适用于在加拿大就读或已毕业、正在决定“留下拿身份 / 回国”的中国籍（或持中国护照）年轻人。已在加拿大以外定居、已入籍多年决策已完成，或以投资移民、团聚移民为主要路径的人，本测试的权重可能不匹配。</p>
<button class="btn" id="go">开始（约 4 分钟）</button>${old&&old.ans&&old.ans.P1?`<div class="warn">检测到上次未完成的作答。<br><button class="btn g" id="res">继续上次</button><button class="btn g" id="rs">重新开始</button></div>`:""}</div>`;
document.getElementById("go").onclick=()=>{S={ans:{},i:0,t0:Date.now(),started:true};save();draw()};
if(old&&old.ans&&old.ans.P1){document.getElementById("res").onclick=()=>{S=old;draw()};document.getElementById("rs").onclick=()=>{clr();start()}}}

function draw(){const sq=seq();if(S.i>=sq.length)return result();const id=sq[S.i],tot=sq.length;
let h=`<div class="card"><div class="mu">第 ${S.i+1} / ${tot} 题</div><div class="bar"><i style="width:${(S.i/tot)*100}%"></i></div>`;
const nx=(lbl,dis)=>`<div class="noprint"><button class="btn g" id="bk" ${S.i?"":"disabled"}>上一题</button><button class="btn" id="nx" ${dis?"disabled":""}>${lbl}</button></div>`;
if(id==="P1"){h+=`<h2>你现在的身份状态是？</h2>`+P1O.map((o,k)=>`<button class="opt ${S.ans.P1===o[1]?"sel":""}" data-v="${o[1]}">${o[0]}</button>`).join("")+nx("下一题",!S.ans.P1)}
else if(id==="P2"){const a=S.ans.P2||{};h+=`<h2>再和我讲讲你的情况吧。</h2>`+P2F.map(([k,l,o])=>`<label>${l}<select data-k="${k}"><option value="">请选择</option>${o.map(x=>`<option ${a[k]===x?"selected":""}>${x}</option>`).join("")}</select></label>`).join("")+nx("下一题",!P2F.every(x=>a[x[0]]))}
else if(id==="Q18"){h+=`<h2>最后一题，不用打分。</h2><p>说一句鼓励自己留下or回流的话吧。</p><textarea id="t18" rows="4" maxlength="200" placeholder="可跳过">${esc(S.ans.Q18||"")}</textarea>`+`<div class="noprint"><button class="btn g" id="bk">上一题</button><button class="btn g" id="sk">跳过</button><button class="btn" id="nx">看结果</button></div>`}
else{const q=QM[id];let stem=q.s;if(id==="Q4"&&S.ans.P1==="pr_pending")stem="如果你的申请被退回或被要求补材料、再拖一年，你能接受吗？";
h+=`<h2>${f(stem)}</h2>${q.n?`<p class="mu">${q.n}</p>`:""}`;
if(q.t==="s"){const v=S.ans[id];h+=`<div class="scale">${[0,1,2,3,4].map(k=>`<button class="dot ${v===k?"sel":""}" data-v="${k}">${k+1}</button>`).join("")}</div><div class="lg">${q.o.map((x,k)=>`${k+1} ${x}`).join(" · ")}</div>`+nx("下一题",v===undefined)}
else if(q.t==="m"){const v=S.ans[id]||[];h+=`<div class="mu">已选 ${v.length}/4</div>`+q.o.map((o,k)=>`<button class="opt ${v.includes(k)?"sel":""}" data-v="${k}" ${!v.includes(k)&&v.length>=4&&k!==5?'disabled title="最多选 4 项，请先取消一个"':""}>${o[0]}</button>`).join("")+(v.length>=4?`<div class="note">最多选 4 项，请先取消一个</div>`:"")+nx("下一题",!v.length)}
else{h+=q.o.map((o,k)=>`<button class="opt ${S.ans[id]===k?"sel":""}" data-v="${k}">${o[0]}</button>`).join("")+nx("下一题",S.ans[id]===undefined)}}
if((S.i+1)%5===0&&id!=="Q18")h+=`<p class="note">相信你的第一直觉。</p>`;
$.innerHTML=h+`</div>`;
const go=()=>{S.i++;save();draw();scrollTo(0,0)};
const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{S.i--;save();draw()};
const nb=document.getElementById("nx");if(nb)nb.onclick=()=>{if(id==="Q18")S.ans.Q18=document.getElementById("t18").value.trim();go()};
const sk=document.getElementById("sk");if(sk)sk.onclick=()=>{S.ans.Q18="";go()};
if(id==="P1")$.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans.P1=b.dataset.v;save();go()});
else if(id==="P2")$.querySelectorAll("select").forEach(s=>s.onchange=()=>{S.ans.P2=Object.assign(S.ans.P2||{},{[s.dataset.k]:s.value});save();draw()});
else if(id!=="Q18"){const q=QM[id];
if(q.t==="s")$.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{S.ans[id]=+b.dataset.v;save();draw()});
else if(q.t==="m")$.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.v;let v=(S.ans[id]||[]).slice();
if(v.includes(k))v=v.filter(x=>x!==k);else if(k===5)v=[5];else{v=v.filter(x=>x!==5);if(v.length>=4)return;
if(k===0&&S.ans.P1==="student"&&!confirm("你目前是学签身份。这 1 年以上的加拿大全职工作经验（不含学业，co-op/兼职是否计入请谨慎核对）是否真实具备？"))return;v.push(k)}
S.ans[id]=v;save();draw()});
else $.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[id]=+b.dataset.v;save();setTimeout(go,150)})}}

function qscore(q,a){const v=a[q.id];if(v===undefined)return null;if(q.t==="m")return Math.min(100,v.reduce((s,k)=>s+q.o[k][1],0));if(q.t==="s")return SC[v];return q.o[v][1]}
function calc(){const a=S.ans,A=isA(),dims={},items={};
for(let d=1;d<=5;d++){let s=0,list=[];Q.filter(q=>q.d===d&&!(A&&SKIPA.includes(q.id))).forEach(q=>{const x=qscore(q,a);if(x!==null){s+=x*q.w;list.push({q,x})}});dims[d]=s;items[d]=list}
if(A)dims[1]=90;
let total=0;if(A){for(let d=2;d<=5;d++)total+=dims[d]*DW[d]/0.76}else for(let d=1;d<=5;d++)total+=dims[d]*DW[d];
const sq=seq().filter(id=>/^Q\d+$/.test(id)&&id!=="Q18"),done=sq.filter(id=>a[id]!==undefined).length;
const r={a,A,dims,items,total,done,sc:(id)=>qscore(QM[id],a)};
const q1=a.Q1||[];
r.insuf=(a.P1==="student"&&q1.includes(5)&&a.Q2===4)||done<12;
let lv=total>=72?4:total>=58?3:total>=44?2:1;r.base=lv;const ov=[];
if(dims[1]<35&&a.Q3===3&&a.P1==="work_permit"){ov.push("O1");lv=Math.min(lv,2)}
let dn=false;
if(dims[2]<40&&r.sc("Q6")<=25&&dims[1]>=70){ov.push("O2");dn=true}
if(a.Q8===2){ov.push("O3");dn=true}
if(a.Q17===1||a.Q17===2){ov.push("O4");dn=true}
if(dn)lv-=1;lv=Math.max(1,lv,r.base-2);
if(A&&dims[2]<45)ov.push("O5");
r.lv=lv;r.ov=ov;return r}

function radar(d){const c=140,R=95,n=5,P=(k,v)=>{const t=-Math.PI/2+k*2*Math.PI/n;return[c+R*v/100*Math.cos(t),c+R*v/100*Math.sin(t)]};
let g=[25,50,75,100].map(v=>`<polygon fill="none" stroke="var(--bd)" points="${[0,1,2,3,4].map(k=>P(k,v).join(",")).join(" ")}"/>`).join("");
g+=[0,1,2,3,4].map(k=>{const[x,y]=P(k,100),[lx,ly]=P(k,122);return`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--bd)"/><text x="${lx}" y="${ly}" font-size="12" text-anchor="middle" fill="var(--tx)">${DN[k+1]}</text>`}).join("");
g+=`<polygon points="${[0,1,2,3,4].map(k=>P(k,d[k+1]).join(",")).join(" ")}" fill="var(--ac2)" fill-opacity=".35" stroke="var(--ac2)" stroke-width="2"/>`;
g+=[0,1,2,3,4].map(k=>{const[x,y]=P(k,Math.max(d[k+1],0));return`<text x="${x}" y="${y-4}" font-size="11" text-anchor="middle" fill="var(--tx)">${Math.round(d[k+1])}</text>`}).join("");
return`<svg viewBox="0 0 280 280" style="width:100%;max-width:340px;display:block;margin:auto">${g}</svg>`}

function policy(r){const a=r.a,F=facts,c=F.cutoffs_2026,L=F.latest_draws,R=F.rules,q1=a.Q1||[],fld=(a.P2||{}).field;
const rg=x=>`${x[0]}–${x[1]}`;let ch=[];
const cat=fld==="医护健康"?["医护与社会服务（类别定向）",c.healthcare,"healthcare"]:fld==="技工与运输"?["技工 / 运输（类别定向）",c.trades,"trades"]:["高级管理（类别定向）",c.senior_managers,"sm"];
if(q1.includes(0))ch.push(["CEC（加拿大经验类）",`过去 ${R.category_experience_window_years} 年内累计 1 年以上加拿大 TEER 0–3 工作经验`,`${rg(c.cec)}；最近一轮 ${L.cec.date}，${L.cec.crs} 分，${L.cec.invitations.toLocaleString()} 人`,"你的经验已达门槛；差距在于综合分能否进入这个区间，新计分规则下需重算。"]);
if(q1.includes(1))ch.push([cat[0],`EE 基本资格 + 类别内工作经验至少 ${R.category_min_experience_years} 年（过去 ${R.category_experience_window_years} 年累计）`,rg(cat[1])+(cat[2]==="trades"?`；运输 ${rg(c.transport)}（${L.transport.date}，${L.transport.crs} 分，${L.transport.invitations} 人）`:""),"需确认你的具体职业确实在已开过轮的类别里，并满足 1 年经验。"]);
if(q1.includes(2))ch.push(["省提名（PNP）",`省提名在 EE 中加 ${R.pnp_crs_bonus} 分；2026 年配额 ${F.levels_plan.pnp_2026.toLocaleString()}`,`EE + 省提名 ${rg(c.ee_pnp)}；最近一轮 ${L.ee_pnp.date}，${L.ee_pnp.crs} 分，${L.ee_pnp.invitations} 人`,"需要省内雇主、职业或地区条件被该省认可。"+(["大多伦多","安省其他"].includes((a.P2||{}).province)?"你在安省：OINP 原 8 个通道已于 2026-06 关闭，旧计算器与职业清单都已作废。":"")]);
if(a.Q3<=1||(a.Q3===2&&ch.length<2))ch.push(["法语能力类别",`法语四项均达 CLB ${R.french_clb_required} 即自动符合类别资格，且仍需满足 EE 基本资格（至少 1 年工作经验、语言、学历）`,`${rg(c.french)}（均值约 404）；最近一轮 ${L.french.date}，${L.french.crs} 分，${L.french.invitations.toLocaleString()} 人`,`CRS 加成 +${R.french_crs_bonus.english_clb4_or_below}（英语 CLB4 及以下）或 +${R.french_crs_bonus.english_clb5_plus}（英语 CLB5 及以上）；需要 12–18 个月的投入。`]);
if(!ch.length)ch.push(["（你目前没有勾选可直接匹配的通道）","先盘点：1 年以上经验、类别、省提名、法语四项中你能补哪一项",`CEC ${rg(c.cec)}；法语 ${rg(c.french)}；省提名 ${rg(c.ee_pnp)}`,"缺的是筹码盘点本身，而不是决心。"]);
ch=ch.slice(0,2);
let h=`<table><tr><th>通道</th><th>2026 门槛</th><th>2026 分数线</th><th>你缺什么</th></tr>${ch.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join("")}</tr>`).join("")}</table>`;
if(r.A)h=`<p class="mu">你的身份已锁定，下列通道仅作参考。</p>`+h;
h+=`<p><b>法语是加速器，不是免死金牌</b>——它能把分数线从 500+ 降到 400 附近，但你仍要满足 EE 的基本资格（至少 1 年工作经验、语言、学历）。</p>`;
h+=`<p class="note">池子现状（${F.pool.as_of}）：EE 候选池 ${F.pool.size.toLocaleString()} 人；481 分及以上 ${F.pool.gte_481.toLocaleString()} 人（20%）；501 分及以上 ${F.pool.gte_501.toLocaleString()} 人（9%）。2026 年 EE（Federal High Skilled）配额 ${F.levels_plan.federal_high_skilled_2026.toLocaleString()}，PR 总目标 ${F.levels_plan.total_pr_2026.toLocaleString()}。</p>`;
h+=`<div class="warn"><b>不确定性声明：</b>2026-11-03 起 EE 计分规则调整，抽签暂停约两周做分数重算，新分数线尚未形成，任何“多少分能上岸”的说法目前都只是估算。</div>`;
h+=`<ul class="note">${F.changes.map(x=>`<li>${x.date}：${x.note}</li>`).join("")}</ul>`;
return h+`<p class="note">${F.disclaimer}</p>`}

function result(){const r=calc(),a=r.a,d=r.dims;let h="";const O=r.ov,card=(t,b)=>`<div class="card"><h2>${t}</h2>${b}</div>`;
const tz=Date.now()-S.t0<15000?`<div class="warn">作答速度很快，结果仅供参考。</div>`:"";
if(r.insuf){h=card("现在还不能给你一个有意义的判断",`<p>你缺的不是决心，是三个具体信息：</p><ol><li>你的 PGWP 语言与专业资格条件是否满足（大学本科及以上需 CLB 7，学院需 CLB 5，并受专业领域限制）。</li><li>你是否有 1 年以上的加拿大 TEER 0–3 工作经验，或其他可用的筹码。</li><li>你英语（或法语）的真实成绩——先正式考一次。</li></ol>${tz}`)+card("政策现实对照",policy(r));
}else{const[code,name,dg]=TYPES[r.lv];
const best=Object.keys(d).map(Number).sort((x,y)=>d[y]-d[x])[0];
const wk=Object.keys(d).map(Number).filter(k=>!(r.A&&k===1)).sort((x,y)=>d[x]-d[y])[0];
const bi=(r.items[best]||[]).slice().sort((x,y)=>y.x-x.x)[0];
const title=O.includes("O5")?`<h2>你已经留下了，现在要解决的是另一件事</h2>`:"";
h+=card("你的倾向",`${title}<div class="big">${Math.round(r.total)}<span class="mu" style="font-size:16px"> / 100 留下倾向分</span></div><div class="bar"><i style="width:${r.total}%"></i></div><span class="tag">${code}｜${name}</span><p>${dg}</p><p class="note">分数只描述倾向，不描述对错，也不是能力或价值判断。</p>${tz}`);
if(Math.abs(d[1]-d[2])>=25)h+=card("一句话反差",`<p style="font-size:18px"><b>${d[1]>d[2]?"你能留下来，但你不会因此更快乐。":"你想留下，但你需要拓宽路径。"}</b></p>`);
h+=card("五维雷达图",radar(d));
h+=card("三个驱动因素",`<ul><li><b>最强支撑项：</b>${DN[best]}（${Math.round(d[best])}）${bi?`，其中“${bi.q.nm}”最高——这是你最硬的底牌。`:"，身份已锁定——这是你最硬的底牌。"}</li><li><b>最大缺口：</b>${DN[wk]}（${Math.round(d[wk])}）——这是真正在拖你的那件事。</li><li><b>反差：</b>${Math.abs(d[1]-d[2])>=25?(d[1]>d[2]?"身份可行性高于情感与归属，差距超过 25 分。":"情感与归属高于身份可行性，差距超过 25 分。"):"身份可行性与情感归属相差不到 25 分，未触发反差句。"}</li></ul>`);
let ex="";
if(a.P1==="student")ex+=`<div class="warn"><b>你现在的最优动作通常不是决定去留，而是先把 PGWP 的语言与专业资格条件确认清楚。</b></div>`;
if(a.P1==="other")ex+=`<div class="warn"><b>身份窗口风险：</b>没有合法工作身份时，可走的通道窗口很窄。先弄清你当前身份的到期日、能否续签或转换，再谈其他。</div>`;
if(O.includes("O1"))ex+=`<div class="warn"><b>时间窗口风险：</b>结论上限锁在“摇摆待定”。工签到期日 = 你真正的决策截止日。</div>`;
if(O.includes("O2"))ex+=`<div class="warn"><b>身份解决了，生活没解决。</b>身份可行性很高，但情感与归属偏低，且可求助的人很少。这是这份测试里最重要的一条诊断：留下的难点已经不在“能不能”，而在“怎么过”。</div>`;
if(O.includes("O4"))ex+=`<div class="warn"><b>关系是决定项。</b>这不是一个人能算完的账。</div>`;
if(a.Q3>=2&&a.Q3!==undefined&&!r.A)ex+=`<p class="note">这不影响你留下，只影响你用什么方式留下。</p>`;
if(a.Q17===4)ex+=`<div class="warn"><b>教育账：</b>加拿大公立 K–12 与国内升学路径各有差异；还要算 daycare 成本。“教育理由”往往需要比其他理由更长的验证期，建议用具体数字来算。</div>`;
if(ex)h+=card("需要你留意的几件事",ex);
h+=card("政策现实对照（截至 2026-11-07）",policy(r));
h+=card("当前最该做的 3 件事",`<ol>${ADV[code].map(x=>`<li>${f(x)}</li>`).join("")}</ol><h3>针对最大缺口：${DN[wk]}</h3><ul>${WADV[wk].map(x=>`<li>${f(x)}</li>`).join("")}</ul>${O.includes("O3")?`<h3>照护方案（钱、人、时间）</h3><ul>${CARE.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}<h3>两边的账</h3><p>${OTHER[r.lv]}</p>`);
}
const ck=(arr)=>arr.map(x=>`<label class="ck"><input type="checkbox"> ${x}</label>`).join("");
if(!r.insuf)h+=card("30 天 / 90 天行动清单",`<h3>30 天</h3>${ck(["把签证到期日、材料清单和你的主通道写进一张表。","核对 IRCC 官网信息，或预约一次 RCIC 咨询。","做一份真实的月度收入—开支表。"])}<h3>90 天</h3>${ck(["对照里程碑自查一次：继续、换备选通道，或调整去留。","建好支持系统：3 个能求助的人 + 1 个固定社群。","和伴侣或家人谈一次“五年后我们各自在哪、做什么”。"])}`);
const t=a.Q18;
if(t){h+=card("你自己写下的那句话",`<p>你自己写下的那句话是……“${esc(t)}”</p>`);
let tx=t.replace(/不(想|要|愿|打算|会)?回|别回/g,"留下"),rt=/回国|回流|回去|回家/.test(tx),st=/留下|留在|留加|扎根|留/.test(tx);
if(!r.insuf&&((rt&&!st&&r.total>=58)||(st&&!rt&&r.total<44)))h+=`<div class="card warn"><b>你的直觉和你的账不一致。</b>你写下的话和上面的分数指向了不同的方向。这条反馈值得多看一眼：是账里漏了什么，还是直觉里夹着别的声音？</div>`}
const vals=r.items[2].concat(r.items[3],r.items[4],r.items[5],r.items[1]).map(x=>x.x);
if(vals.length>8&&(vals.every(x=>x>=50)||vals.every(x=>x<=50)))h+=card("答案的一致性",`<p>你的答案非常一致，这通常说明你心里早有答案，只是还没允许自己说出来。</p>`);
h+=card("边界与免责",`<p>${FIN}</p>`)+`<div class="card noprint"><h2>把这个测试答案保存成一份决策记录</h2><p class="note">记录日期：${new Date().toLocaleDateString("zh-CN")}；政策基准日：${facts.as_of}。点击后在打印窗口选择“另存为 PDF”。</p><button class="btn" onclick="print()">导出 PDF</button><button class="btn g" id="again">重新测试</button></div>`;
$.innerHTML=h;scrollTo(0,0);document.getElementById("again").onclick=()=>{clr();S={ans:{},i:0,t0:0};start()}}
start();
</script></body></html>
